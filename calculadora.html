<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
    <div class="mostrador">
        <p class="equacao">escreva algo </p>
        <p class="resultado">ANSWER</p>
    </div>
    <div class="Botaomatematicabasicaa">
        <div class="fileira1">
            <button class="position1" onclick="seven()"> 7 </button>
            <button class="position2" onclick="eight()"> 8 </button>
            <button class="position3" onclick="nine()"> 9 </button>
            <button class="position4" onclick="Del()"> DEL </button>
            <button class="position5" onclick="AC()"> AC </button>
                </div>

                <div class="fileira2">
            <button class="position1"> 4 </button>
            <button class="position2"> 5 </button>
            <button class="position3"> 6 </button>
            <button class="position4"> × </button>
            <button class="position5"> ÷ </button>
                 </div> 


             <div class="fileira3">
            <button class="position1"> 1 </button>
            <button class="position2"> 2 </button>
            <button class="position3"> 3 </button>
            <button class="position4"> + </button>
            <button class="position5"> - </button>
                 </div> 
                 
                  
             <div class="fileira4">
            <button class="position1"> 0 </button>
            <button class="position2"> . </button>
            <button class="position3"> π </button>
            <button class="position4"> H </button>
            <button class="position5"> = </button>
                 </div> 
    </div>
    <script>
        function seven () {
            let a = window.document.querySelector('.equacao');
                        
                        if ( a.innerText === 'escreva algo' || a.innerText === '') {
                            a.innerText = '7';
                        }
                        else{
                            a.append ('7');
                            }
        }
                function eight () {
            let a = window.document.querySelector('.equacao');
                        
                        if ( a.innerText === 'escreva algo' || a.innerText === '') {
                            a.innerText = '8';
                        }
                        else{
                            a.append ('8');
                            }
        }
                function nine () {
            let a = window.document.querySelector('.equacao');
                        
                        if ( a.innerText === 'escreva algo' || a.innerText === '') {
                            a.innerText = '9';
                        }
                        else{
                            a.append ('9');
                            }
        }
        function Del(){
            let a = window.document.querySelector('.equacao')
            if(a.innerText === 'escreva algo' || a.innerText === ''){
             return 0;}
             else {
                a.innerText = a.innerText.slice(0, -1);
             }
             if (a.innerText === '') {
                a.innerText = 'escreva algo';
             }
        }
    </script>
</body>
</html>
