<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
    <div class="mostrador">
        <p class="equacao">escreva algo </p>
        <p class="resultado">ANSWER</p>
    </div>
    <div class="Botaomatematicabasicaa">
        <div class="fileira1">
            <button class="position1" class="Number" onclick="Numeros(this)" value="7"> 7 </button>
            <button class="position2" class="Number" onclick="Numeros(this)" value="8"> 8 </button>
            <button class="position3" class="Number" onclick="Numeros(this)" value="9"> 9 </button>
            <button class="position4" onclick="Del()"> DEL </button>
            <button class="position5" onclick="AC()"> AC </button>
                </div>

                <div class="fileira2">
            <button class="position1" class="Number" onclick="Numeros(this)" value="4"> 4 </button>
            <button class="position2"  class="Number" onclick="Numeros(this)" value="5"> 5 </button>
            <button class="position3"  class="Number" onclick="Numeros(this)" value="6"> 6 </button>
            <button class="position4"> × </button>
            <button class="position5"> ÷ </button>
                 </div> 


             <div class="fileira3">
            <button class="position1" class="Number" onclick="Numeros(this)" value="1"> 1 </button>
            <button class="position2" class="Number" onclick="Numeros(this)" value="2"> 2 </button>
            <button class="position3" class="Number" onclick="Numeros(this)" value="3"> 3 </button>
            <button class="position4"> + </button>
            <button class="position5"> - </button>
                 </div> 
                 
                  
             <div class="fileira4">
            <button class="position1" onclick="Numeros(this)"> 0 </button>
            <button class="position2" > . </button>
            <button class="position3"> π </button>
            <button class="position4"> H </button>
            <button class="position5"> = </button>
                 </div> 
    </div>
    <script>
        function Numeros (valor) {  
               let a = window.document.querySelector('.equacao');
               let numero = valor.innerText;
                        if ( a.innerText === 'escreva algo' || a.innerText === '') {
                            a.innerText = numero;
                        }
                        else{
                            a.append (numero);
                            }
        }
                
        function Del(){
            let a = window.document.querySelector('.equacao')
            if(a.innerText === 'escreva algo' || a.innerText === ''){
             return 0;}
             else {
                a.innerText = a.innerText.slice(0, -1);
             }
             if (a.innerText === '') {
                a.innerText = 'escreva algo';
             }
        }
        function AC(){
            let a = window.document.querySelector('.equacao');
            a.innerText = 'escreva algo';
        }
    </script>
</body>
</html>
